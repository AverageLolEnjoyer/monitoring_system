<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лог восстановлений - Мониторинг</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header h1 { color: #333; margin-bottom: 10px; }
        .header p { color: #666; }
        
        .nav-links {
            margin-top: 15px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #667eea;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .nav-links a:hover { background: #f0f0f0; }
        .nav-links a.active { background: #667eea; color: white; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .stat-card h3 { color: #666; font-size: 14px; margin-bottom: 10px; }
        .stat-value { font-size: 32px; font-weight: bold; }
        .stat-value.healthy { color: #4caf50; }
        .stat-value.warning { color: #ff9800; }

        .recovery-log {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .recovery-log h3 { margin-bottom: 15px; color: #333; }

        .log-table {
            width: 100%;
            border-collapse: collapse;
        }
        .log-table th, .log-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        .log-table th {
            background: #f8f9fa;
            font-weight: bold;
            color: #666;
        }
        .log-table tr:hover { background: #f5f5f5; }

        .success-badge {
            background: #d4edda;
            color: #155724;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
        }
        .failure-badge {
            background: #f8d7da;
            color: #721c24;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .refresh-info {
            text-align: center;
            margin-top: 20px;
            color: white;
            font-size: 12px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .loading { animation: pulse 1.5s ease-in-out infinite; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔄 История автоматических восстановлений</h1>
            <p>Лог всех попыток восстановления сервисов</p>
            <div class="nav-links">
                <a href="/">📈 Дашборд</a>
                <a href="/services">🔧 Сервисы</a>
                <a href="/recovery" class="active">🔄 Лог восстановлений</a>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Всего восстановлений</h3>
                <div id="total-recoveries" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <h3>Успешных</h3>
                <div id="successful-recoveries" class="stat-value healthy">0</div>
            </div>
            <div class="stat-card">
                <h3>Успешность</h3>
                <div id="success-rate" class="stat-value">0%</div>
            </div>
        </div>

        <div class="recovery-log">
            <h3>📋 Детальный лог восстановлений</h3>
            <div id="recovery-list">
                <div class="empty-state loading">Загрузка данных...</div>
            </div>
        </div>

        <div class="refresh-info">
            🔄 Данные обновляются каждые 10 секунд
        </div>
    </div>

    <script>
        // Загрузка статистики восстановлений
        async function loadRecoveryStats() {
            try {
                const response = await fetch('/api/recovery-stats');
                const stats = await response.json();

                document.getElementById('total-recoveries').textContent = stats.total_recoveries || 0;
                document.getElementById('successful-recoveries').textContent = stats.successful_recoveries || 0;
                const rate = stats.success_rate || 0;
                document.getElementById('success-rate').textContent = `${rate.toFixed(1)}%`;

                const rateElement = document.getElementById('success-rate');
                if (rate >= 90) rateElement.className = 'stat-value healthy';
                else if (rate >= 70) rateElement.className = 'stat-value warning';
                else rateElement.className = 'stat-value';

            } catch(e) {
                console.error('Stats load failed:', e);
            }
        }

        // Загрузка детального лога из recovery_events
        async function loadRecoveryLog() {
            try {
                const response = await fetch('/api/recovery-events');
                const events = await response.json();
                const container = document.getElementById('recovery-list');

                if (events.error) {
                    container.innerHTML = `<div class="empty-state">❌ Ошибка загрузки: ${events.error}</div>`;
                    return;
                }

                if (!events || events.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <p>📭 Нет записей о восстановлениях</p>
                            <p style="font-size: 12px; margin-top: 10px;">Когда система автоматически восстановит сервис, здесь появится запись</p>
                            <p style="font-size: 12px; margin-top: 5px;">💡 Попробуйте остановить payment-service вручную для демонстрации</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = `
                    <table class="log-table">
                        <thead>
                            <tr><th>Время</th><th>Сервис</th><th>Результат</th><th>Метод</th><th>Детали</th></tr>
                        </thead>
                        <tbody>
                            ${events.map(event => `
                                <tr>
                                    <td>${new Date(event.timestamp * 1000).toLocaleString()}</td>
                                    <td><strong>${event.service_name}</strong></td>
                                    <td>${event.success ?
                                        '<span class="success-badge">✅ Успешно</span>' :
                                        '<span class="failure-badge">❌ Ошибка</span>'}</td>
                                    <td>${event.recovery_method || 'auto_restart'}</td>
                                    <td>${event.details || '-'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch(e) {
                console.error('Recovery log load failed:', e);
                document.getElementById('recovery-list').innerHTML = '<div class="empty-state">❌ Ошибка загрузки данных</div>';
            }
        }

        loadRecoveryStats();
        loadRecoveryLog();

        setInterval(loadRecoveryStats, 10000);
        setInterval(loadRecoveryLog, 10000);
    </script>
</body>
</html>
