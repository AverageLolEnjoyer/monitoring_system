<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Метрики - Мониторинг</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header h1 { color: #333; margin-bottom: 10px; }
        .header p { color: #666; }
        
        .nav-links {
            margin-top: 15px;
            display: flex;
            gap: 20px;
        }
        .nav-links a {
            color: #667eea;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .nav-links a:hover { background: #f0f0f0; }
        .nav-links a.active { background: #667eea; color: white; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .stat-card h3 {
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }
        .metric-item {
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
        }
        .metric-label { color: #666; }
        .metric-value { font-weight: bold; color: #333; }
        .metric-value.healthy { color: #4caf50; }
        .metric-value.unhealthy { color: #f44336; }
        
        .chart-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .chart-container h3 { margin-bottom: 15px; color: #333; }
        
        .refresh-info {
            text-align: center;
            margin-top: 20px;
            color: white;
            font-size: 12px;
        }
    </style>
    <script src="https://cdn.plot.ly/plotly-3.0.1.min.js" charset="utf-8"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📈 Метрики микросервисов</h1>
            <p>Статистика доступности и времени ответа</p>
            <div class="nav-links">
                <a href="/">📈 Дашборд</a>
                <a href="/services">🔧 Сервисы</a>
                <a href="/metrics" class="active">📉 Метрики</a>
                <a href="/recovery">🔄 Лог восстановлений</a>
            </div>
        </div>
        
        <div class="stats-grid" id="metrics-stats">
            <div class="stat-card">
                <h3>👤 User Service</h3>
                <div id="user-metrics">Загрузка...</div>
            </div>
            <div class="stat-card">
                <h3>💳 Payment Service</h3>
                <div id="payment-metrics">Загрузка...</div>
            </div>
            <div class="stat-card">
                <h3>🚪 Gateway Service</h3>
                <div id="gateway-metrics">Загрузка...</div>
            </div>
        </div>
        
        <div class="chart-container">
            <h3>📊 Динамика времени ответа сервисов (мс)</h3>
            <div id="response-chart"></div>
        </div>
        
        <div class="refresh-info">
            Данные обновляются каждые 5 секунд
        </div>
    </div>
    
    <script>
        let chartData = {
            'user-service': [],
            'payment-service': [],
            'gateway-service': []
        };
        
        async function loadMetrics() {
            try {
                const response = await fetch('/api/metrics?limit=100');
                const metrics = await response.json();
                
                const services = ['user-service', 'payment-service', 'gateway-service'];
                const prefixes = { 'user-service': 'user', 'payment-service': 'payment', 'gateway-service': 'gateway' };
                
                for (const service of services) {
                    const serviceMetrics = metrics.filter(m => m.service_name === service);
                    const prefix = prefixes[service];
                    
                    if (serviceMetrics.length > 0) {
                        const lastMetric = serviceMetrics[0];
                        const healthyCount = serviceMetrics.filter(m => m.is_healthy === 1).length;
                        const availability = (healthyCount / serviceMetrics.length * 100).toFixed(1);
                        const avgTime = (serviceMetrics.reduce((sum, m) => sum + (m.response_time_ms || 0), 0) / serviceMetrics.length).toFixed(1);
                        
                        let statusColor = '';
                        if (availability >= 95) statusColor = 'healthy';
                        else if (availability >= 70) statusColor = '';
                        else statusColor = 'unhealthy';
                        
                        document.getElementById(`${prefix}-metrics`).innerHTML = `
                            <div class="metric-item">
                                <span class="metric-label">Текущий статус:</span>
                                <span class="metric-value ${lastMetric.is_healthy ? 'healthy' : 'unhealthy'}">${lastMetric.status || 'unknown'}</span>
                            </div>
                            <div class="metric-item">
                                <span class="metric-label">Доступность:</span>
                                <span class="metric-value ${statusColor}">${availability}%</span>
                            </div>
                            <div class="metric-item">
                                <span class="metric-label">Ср. время ответа:</span>
                                <span class="metric-value">${avgTime} мс</span>
                            </div>
                            <div class="metric-item">
                                <span class="metric-label">Последний ответ:</span>
                                <span class="metric-value">${lastMetric.response_time_ms || '-'} мс</span>
                            </div>
                            <div class="metric-item">
                                <span class="metric-label">Всего проверок:</span>
                                <span class="metric-value">${serviceMetrics.length}</span>
                            </div>
                        `;
                        
                        // Обновляем данные для графика
                        chartData[service] = serviceMetrics.reverse().slice(-30).map(m => ({
                            time: new Date(m.timestamp * 1000),
                            value: m.response_time_ms || 0
                        }));
                    } else {
                        document.getElementById(`${prefix}-metrics`).innerHTML = '<p>Нет данных</p>';
                    }
                }
                
                updateChart();
                
            } catch(e) {
                console.error('Metrics load failed:', e);
            }
        }
        
        function updateChart() {
            const traces = [];
            const colors = {'user-service': '#667eea', 'payment-service': '#ff9800', 'gateway-service': '#4caf50'};
            const names = {'user-service': 'User Service', 'payment-service': 'Payment Service', 'gateway-service': 'Gateway Service'};
            
            for (const [service, data] of Object.entries(chartData)) {
                if (data.length > 0) {
                    traces.push({
                        x: data.map(d => d.time),
                        y: data.map(d => d.value),
                        name: names[service],
                        type: 'scatter',
                        mode: 'lines+markers',
                        line: { color: colors[service], width: 2 },
                        marker: { size: 6 }
                    });
                }
            }
            
            const layout = {
                title: 'Время ответа сервисов',
                xaxis: { title: 'Время' },
                yaxis: { title: 'Время ответа (мс)' },
                hovermode: 'closest',
                legend: { x: 0, y: 1 }
            };
            
            Plotly.newPlot('response-chart', traces, layout, { responsive: true });
        }
        
        loadMetrics();
        setInterval(loadMetrics, 5000);
    </script>
</body>
</html>
